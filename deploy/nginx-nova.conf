# nginx para la tienda NOVA DIAMONDS YXJ: https://novadiamonds.co
# La tienda corre con PM2 en 127.0.0.1:3040 (deploy/ecosystem.config.js).
#
# DNS (GoDaddy → novadiamonds.co → DNS):  A  @ → 31.220.52.31   ·   CNAME  www → novadiamonds.co.
# Certificado (sin que certbot toque archivos de nginx; ver deploy/LEEME-VPS.md):
#   certbot certonly --nginx -d novadiamonds.co -d www.novadiamonds.co
# Instalar:
#   cp deploy/nginx-nova.conf /etc/nginx/sites-available/nova-diamonds-yxj && nginx -t && systemctl reload nginx

upstream nova_tienda {
    server 127.0.0.1:3040;
    keepalive 16;
}

# HTTP → HTTPS (dominio propio, www y el subdominio anterior)
server {
    listen 80;
    listen [::]:80;
    server_name novadiamonds.co www.novadiamonds.co nova.llanostudio.co;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://novadiamonds.co$request_uri; }
}

# www → sin www (una sola dirección para los buscadores)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.novadiamonds.co;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/novadiamonds.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novadiamonds.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://novadiamonds.co$request_uri;
}

# Subdominio anterior → dominio propio (los enlaces viejos siguen funcionando)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nova.llanostudio.co;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nova.llanostudio.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova.llanostudio.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://novadiamonds.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name novadiamonds.co;
    server_tokens off;
    client_max_body_size 8m; # imágenes subidas desde el panel

    ssl_certificate /etc/letsencrypt/live/novadiamonds.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novadiamonds.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://nova_tienda;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr (no $proxy_add_x_forwarded_for): nadie puede falsear su IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
