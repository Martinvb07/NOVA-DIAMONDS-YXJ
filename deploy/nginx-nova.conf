# nginx para la tienda NOVA DIAMONDS YXJ en el subdominio nova.llanostudio.co
# Instalar:
#   cp deploy/nginx-nova.conf /etc/nginx/sites-available/nova-diamonds-yxj
#   ln -sf /etc/nginx/sites-available/nova-diamonds-yxj /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d nova.llanostudio.co --redirect      # agrega el HTTPS a este mismo archivo
#
# DNS de llanostudio.co: registro A  nova -> IP del VPS (31.220.52.31).
# La tienda corre con PM2 en 127.0.0.1:3040 (deploy/ecosystem.config.js).

upstream nova_tienda {
    server 127.0.0.1:3040;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nova.llanostudio.co;
    server_tokens off; # no anunciar la versión de nginx
    client_max_body_size 8m; # imágenes subidas desde el panel

    location / {
        proxy_pass http://nova_tienda;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr (no $proxy_add_x_forwarded_for): nadie puede falsear su IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
