<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0f14"/>
      <stop offset="0.6" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#0d3a6e"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff3ff"/><stop offset="1" stop-color="#1484f0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="320" r="240" fill="#29a8ff" opacity=".22" filter="url(#glow)"/>
  <g opacity=".07" stroke="#fff"><path d="M0 0 H1200 M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/></g>

  <!-- ícono devolución -->
  <g filter="url(#shadow)" transform="translate(60 0) scale(0.92) translate(80 26)">
    <circle cx="930" cy="315" r="190" fill="#151a24" stroke="url(#volt)" stroke-width="12"/>
    <path d="M830 330 a100 100 0 1 0 30 -90" fill="none" stroke="url(#volt)" stroke-width="30" stroke-linecap="round"/>
    <path d="M818 200 L870 238 L820 282 Z" fill="#29a8ff"/>
    <text x="935" y="352" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="104" fill="#dff3ff">$</text>
  </g>

  <text x="66" y="190" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="68" fill="#fff">SI LA ENTREGA</text>
  <text x="66" y="272" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="68" fill="#fff">FALLA, TE</text>
  <text x="66" y="364" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="80" fill="url(#volt)">DEVOLVEMOS</text>
  <text x="66" y="446" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="68" fill="#fff">TU DINERO</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#c9d3e3">
    <text x="70" y="530">✔ Pago verificado   ✔ Sin contraseñas   ✔ Soporte real</text>
  </g>
</svg>
